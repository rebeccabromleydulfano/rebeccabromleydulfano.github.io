# Site configuration for academicpages (Jekyll)
# Fields marked TODO need your input. After editing _config.yml,
# restart `jekyll serve` (config changes are not hot-reloaded).

# -----------------------------------------------------------------------------
# Site Settings
# -----------------------------------------------------------------------------
locale                   : "en-US"
title                    : "Rebecca Bromley-Dulfano"
title_separator          : "-"
name                     : &name "Rebecca Bromley-Dulfano"
description              : &description "Personal website of Rebecca Bromley-Dulfano: physician-in-training and health policy researcher."
url                      : "https://rebeccabromleydulfano.github.io"
baseurl                  : ""                              # leave empty for a username.github.io or custom-domain site
repository               : "rebeccabromleydulfano/rebeccabromleydulfano.github.io"
teaser                   :                                 # fallback teaser image in /images/, e.g. "500x300.png"
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
timezone                 : America/Los_Angeles             # TODO: change if needed

# -----------------------------------------------------------------------------
# Site Author (shown in the left sidebar)
# -----------------------------------------------------------------------------
author:
  name             : *name
  avatar           : "profile.png"          # put your headshot at /images/profile.png
  bio              : "MD Candidate at Stanford School of Medicine; PhD in Health Policy, Harvard University"
  location         : "TODO: City, State"
  employer         : "Stanford School of Medicine"
  pronouns         : ""                              # TODO: optional, e.g. "she/her"
  email            : "rabd@stanford.edu"             # TODO: choose which address to display publicly
  uri              : ""                              # personal link, if different from site url
  googlescholar    : ""                              # TODO: full Google Scholar profile URL
  orcid            : ""                              # TODO: e.g. https://orcid.org/0000-0000-0000-0000
  pubmed           : ""
  researchgate     : ""
  linkedin         : ""                              # TODO: username only, e.g. "rebecca-bromley-dulfano"
  github           : ""                              # TODO: GitHub username
  bluesky          : ""
  twitter          : ""
  # Leave any other social fields from the template untouched/blank.

# -----------------------------------------------------------------------------
# Footer / Analytics / Comments
# -----------------------------------------------------------------------------
footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:rabd@stanford.edu"                # TODO: match the email above
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: ""                                        # TODO: optional

analytics:
  provider               : false                     # set to "google-gtag" and add tracking_id to enable
comments:
  provider               : false

# -----------------------------------------------------------------------------
# Reading Files
# -----------------------------------------------------------------------------
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs        # ignore the template's docs folder
  - /images/originals
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# -----------------------------------------------------------------------------
# Conversion
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# -----------------------------------------------------------------------------
# Markdown Processing
# -----------------------------------------------------------------------------
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# -----------------------------------------------------------------------------
# Sass / CSS
# -----------------------------------------------------------------------------
sass:
  sass_dir: _sass
  style: compressed

# -----------------------------------------------------------------------------
# Outputting
# -----------------------------------------------------------------------------
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jemoji

# Mimic GitHub Pages with --safe
safe: false

# -----------------------------------------------------------------------------
# Collections
# (Each folder of Markdown files becomes a section: _publications/, _talks/, etc.)
# Remove portfolio below if you don't plan to use it, and delete it from
# _data/navigation.yml too.
# -----------------------------------------------------------------------------
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# -----------------------------------------------------------------------------
# Collection defaults
# -----------------------------------------------------------------------------
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true
      comments: false
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

# -----------------------------------------------------------------------------
# Archives
# -----------------------------------------------------------------------------
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
